name: research-catalog
# Stage 1: collect public channel metadata with yt-dlp (no media is downloaded).
on:
  workflow_dispatch:
  push:
    paths: ["research/pipeline/requests/catalog.request"]
permissions:
  contents: write
concurrency: { group: research-commit, cancel-in-progress: false }
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -U "yt-dlp[default]"
      - run: yt-dlp --version
      - run: python research/pipeline/collect_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/catalog.csv research/data/catalog_raw.jsonl research/data/catalog_info.json
          git commit -m "data: channel catalog snapshot (yt-dlp, metadata only)" || exit 0
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i*5)); done
